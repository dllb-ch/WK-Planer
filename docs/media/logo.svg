<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="WK-Planer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff8a1f"/>
      <stop offset="1" stop-color="#f26a00"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#7a2e00" flood-opacity="0.28"/>
    </filter>
  </defs>
  <!-- App tile -->
  <rect width="512" height="512" rx="114" fill="url(#bg)"/>
  <!-- Planning sheet -->
  <g filter="url(#shadow)">
    <rect x="92" y="104" width="328" height="312" rx="38" fill="#ffffff"/>
  </g>
  <!-- Header with the two rings of a planner -->
  <path d="M92 142a38 38 0 0 1 38-38h252a38 38 0 0 1 38 38v26H92z" fill="#1e3a8a"/>
  <rect x="158" y="80" width="22" height="56" rx="11" fill="#1e3a8a" stroke="#ffffff" stroke-width="8"/>
  <rect x="332" y="80" width="22" height="56" rx="11" fill="#1e3a8a" stroke="#ffffff" stroke-width="8"/>
  <!-- Blocks of the Arbeitsprogramm: one column per Zug -->
  <rect x="122" y="194" width="268" height="34" rx="10" fill="#1e3a8a" opacity="0.9"/>
  <rect x="122" y="240" width="80" height="78" rx="10" fill="#2563eb"/>
  <rect x="216" y="240" width="80" height="48" rx="10" fill="#16a34a"/>
  <rect x="310" y="240" width="80" height="126" rx="10" fill="#f26a00"/>
  <rect x="122" y="330" width="80" height="56" rx="10" fill="#93b4f5"/>
  <rect x="216" y="300" width="80" height="86" rx="10" fill="#2563eb"/>
</svg>
