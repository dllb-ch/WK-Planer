# Production behind an existing Traefik reverse proxy: app + PostgreSQL.
# Assumes a Docker network «proxy» shared with Traefik, entrypoints «http»/«https» and a middleware «redirect-https».
# Settings and secrets in .env next to this file (see .env.example). Without Traefik use the docker-compose.yml in the root.
services:
  app:
    build: ..
    image: zs-planer:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://zs:${POSTGRES_PASSWORD}@db:5432/zs
      GATE_USER: ${GATE_USER}
      GATE_PASSWORD: ${GATE_PASSWORD}
      TRUST_PROXY: '1'
    networks: [proxy, internal]
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.zs_http.entrypoints=http
      - traefik.http.routers.zs_http.rule=Host(`${DOMAIN}`)
      - traefik.http.routers.zs_http.middlewares=redirect-https
      - traefik.http.routers.zs_https.entrypoints=https
      - traefik.http.routers.zs_https.rule=Host(`${DOMAIN}`)
      - traefik.http.routers.zs_https.tls=true
      - traefik.http.routers.zs_https.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}
      - traefik.http.routers.zs_https.service=zs
      - traefik.http.services.zs.loadbalancer.server.port=8080
  db:
    image: postgres:16.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: zs
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: zs
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U zs -d zs']
      interval: 5s
      retries: 20
networks:
  proxy:
    external: true
  internal: {}
